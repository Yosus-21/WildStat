[project]
name = "faunalens-ai"
version = "0.1.0"
description = "Microservicio IA para deteccion de jaguar en imagenes y videos de camaras trampa."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35.0",
  "opencv-python>=4.11.0",
  "ultralytics>=8.3.0",
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "numpy>=2.2.0",
  "pandas>=2.3.0",
  "pillow>=11.2.0",
  "roboflow>=1.2.0",
  "python-dotenv>=1.1.0",
  "pydantic-settings>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
